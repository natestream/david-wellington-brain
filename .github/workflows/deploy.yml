# One repo, every account. On merge to main (or "Run workflow"):
#   check → staging (Nate's account, full smoke test) → production targets (David's account, health check)
#
# Each target is a GitHub Environment (Settings → Environments) with ONE secret: DOPPLER_TOKEN,
# a read-only Doppler service token for that target's CI config. Every other key lives in Doppler and
# is fetched at run time by scripts/doppler-env.sh (no sync). See README "All keys live in Doppler".
# Production targets come from the repo variable PROD_TARGETS, e.g. ["david"].
# Leave it unset and only staging deploys. A new client = a new Environment + one entry.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer merge waits for the running one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  staging:
    needs: check
    runs-on: ubuntu-latest
    environment: staging
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Load keys from Doppler
        run: scripts/doppler-env.sh
      - run: npm ci
      - id: deploy
        run: scripts/ci-deploy.sh
      - name: Smoke test (writes test data)
        run: npm run smoke -- --url "${{ steps.deploy.outputs.url }}" --cleanup-file "$RUNNER_TEMP/cleanup.sh"
      - name: Clean up smoke test data
        if: always() && steps.deploy.outcome == 'success'
        run: |
          if [ -f "$RUNNER_TEMP/cleanup.sh" ]; then bash "$RUNNER_TEMP/cleanup.sh"; else echo "nothing to clean up"; fi

  production:
    needs: staging
    if: vars.PROD_TARGETS != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(vars.PROD_TARGETS) }}
    # Add "Required reviewers" to an Environment to approve each production deploy by hand.
    environment: ${{ matrix.target }}
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Load keys from Doppler
        run: scripts/doppler-env.sh
      - run: npm ci
      - id: deploy
        run: scripts/ci-deploy.sh
      - name: Health check (read-only, no test data on a real account)
        run: npm run smoke -- --url "${{ steps.deploy.outputs.url }}" --health
