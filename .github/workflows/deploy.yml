# One repo, two Workers on Nate's Cloudflare account (wrangler.jsonc):
#   push to main          → check → staging (full smoke test)
#   Run workflow, target   → check → staging → production (David's brain, read-only health check)
#     = production
# Production deploys ONLY when started by hand with target "production" (Claude does this when
# Nate says "ship it" in chat). Nothing in GitHub settings needs changing: the one GitHub secret is
# the `staging` Environment's DOPPLER_TOKEN (Doppler stg_ci). Production's keys are one hop further:
# stg_ci holds PRD_CI_DOPPLER_TOKEN, a read-only token for prd_ci (scripts/doppler-env.sh).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "staging only, or staging then production (David's brain)"
        type: choice
        options: [staging, production]
        default: staging

# Never run two deploys at once; a newer merge waits for the running one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  staging:
    needs: check
    runs-on: ubuntu-latest
    environment: staging
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Load keys from Doppler
        run: scripts/doppler-env.sh
      - run: npm ci
      - id: deploy
        run: scripts/ci-deploy.sh
      - name: Smoke test (writes test data)
        run: npm run smoke -- --url "${{ steps.deploy.outputs.url }}" --cleanup-file "$RUNNER_TEMP/cleanup.sh"
      - name: Clean up smoke test data
        if: always() && steps.deploy.outcome == 'success'
        run: |
          if [ -f "$RUNNER_TEMP/cleanup.sh" ]; then bash "$RUNNER_TEMP/cleanup.sh"; else echo "nothing to clean up"; fi

  production:
    needs: staging
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    # The `staging` Environment only for its DOPPLER_TOKEN (stg_ci). Every production key comes from
    # Doppler prd_ci, reached through stg_ci's PRD_CI_DOPPLER_TOKEN.
    environment: staging
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      DOPPLER_HOP: PRD_CI_DOPPLER_TOKEN
      WRANGLER_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Load production keys from Doppler (prd_ci)
        run: scripts/doppler-env.sh
      - run: npm ci
      - id: deploy
        run: scripts/ci-deploy.sh
      - name: Health check (read-only, never writes to David's brain)
        run: npm run smoke -- --url "${{ steps.deploy.outputs.url }}" --health
